name: Build DTB for EMB-3531

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler git make gcc bison flex libssl-dev
      
      - name: Download Linux kernel source
        run: |
          git clone --depth 1 --branch v6.6 https://github.com/torvalds/linux.git linux-6.6
      
      - name: Copy DTS to kernel
        run: |
          cp emb-3531-armbian.dts linux-6.6/arch/arm64/boot/dts/rockchip/
      
      - name: Build DTB
        run: |
          cd linux-6.6
          make ARCH=arm64 defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs 2>&1 | head -100
          cpp -nostdinc -I include -I arch/arm64/boot/dts -I arch/arm64/boot/dts/rockchip -undef -x assembler-with-cpp arch/arm64/boot/dts/rockchip/emb-3531-armbian.dts | dtc -I dts -O dtb -o emb-3531-armbian.dtb -
      
      - name: Upload DTB artifact
        uses: actions/upload-artifact@v3
        with:
          name: emb-3531-armbian-dtb
          path: linux-6.6/emb-3531-armbian.dtb
